<!-- Textarea Component -->
<!-- Usage: {% include 'components/forms/textarea.html' with context %}
    Required params: name, label
    Optional params: placeholder, rows=4, value, required=False, error
-->
<div class="mb-4">
    <label for="{{ name }}" class="block text-sm font-medium text-gray-700 mb-2">
        {{ label }}
        {% if required %}<span class="text-red-500">*</span>{% endif %}
    </label>
    <textarea
        id="{{ name }}"
        name="{{ name }}"
        rows="{{ rows | default(4) }}"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition resize-none
               {% if error %} border-red-500 bg-red-50 {% endif %}"
        placeholder="{{ placeholder | default('') }}"
        {% if required %}required{% endif %}
    >{{ value | default('') }}</textarea>
    {% if error %}
    <p class="text-red-500 text-sm mt-1">{{ error }}</p>
    {% endif %}
</div>
