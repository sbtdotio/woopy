<!-- Select/Dropdown Component -->
<!-- Usage: {% include 'components/forms/select.html' with context %}
    Required params: name, label, options (list of tuples: [(value, label), ...])
    Optional params: value, required=False, error
-->
<div class="mb-4">
    <label for="{{ name }}" class="block text-sm font-medium text-gray-700 mb-2">
        {{ label }}
        {% if required %}<span class="text-red-500">*</span>{% endif %}
    </label>
    <select
        id="{{ name }}"
        name="{{ name }}"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition
               {% if error %} border-red-500 bg-red-50 {% endif %}"
        {% if required %}required{% endif %}
    >
        <option value="">-- Select an option --</option>
        {% for opt_value, opt_label in options %}
        <option value="{{ opt_value }}" {% if opt_value == value %}selected{% endif %}>
            {{ opt_label }}
        </option>
        {% endfor %}
    </select>
    {% if error %}
    <p class="text-red-500 text-sm mt-1">{{ error }}</p>
    {% endif %}
</div>
