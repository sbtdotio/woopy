<!-- Button Component -->
<!-- Usage: {% include 'components/button.html' with context %}
    Required params: text
    Optional params: href, type="button", variant="primary" (primary|secondary|danger), size="md" (sm|md|lg), disabled=False, hx_post, hx_get
-->
{% if href %}
<a
    href="{{ href }}"
    class="inline-flex items-center justify-center font-medium rounded-lg transition
           {% if size == 'sm' %} px-3 py-1 text-sm {% endif %}
           {% if size == 'md' %} px-5 py-2 text-base {% endif %}
           {% if size == 'lg' %} px-6 py-3 text-lg {% endif %}
           {% if variant == 'primary' %} bg-blue-600 text-white hover:bg-blue-700 active:bg-blue-800 {% endif %}
           {% if variant == 'secondary' %} bg-gray-200 text-gray-900 hover:bg-gray-300 active:bg-gray-400 {% endif %}
           {% if variant == 'danger' %} bg-red-600 text-white hover:bg-red-700 active:bg-red-800 {% endif %}
           {% if disabled %} opacity-50 cursor-not-allowed {% endif %}"
    {% if disabled %}disabled{% endif %}
>
    {{ text }}
</a>
{% else %}
<button
    type="{{ type | default('button') }}"
    class="inline-flex items-center justify-center font-medium rounded-lg transition
           {% if size == 'sm' %} px-3 py-1 text-sm {% endif %}
           {% if size == 'md' %} px-5 py-2 text-base {% endif %}
           {% if size == 'lg' %} px-6 py-3 text-lg {% endif %}
           {% if variant == 'primary' %} bg-blue-600 text-white hover:bg-blue-700 active:bg-blue-800 disabled:opacity-50 disabled:cursor-not-allowed {% endif %}
           {% if variant == 'secondary' %} bg-gray-200 text-gray-900 hover:bg-gray-300 active:bg-gray-400 disabled:opacity-50 disabled:cursor-not-allowed {% endif %}
           {% if variant == 'danger' %} bg-red-600 text-white hover:bg-red-700 active:bg-red-800 disabled:opacity-50 disabled:cursor-not-allowed {% endif %}"
    {% if disabled %}disabled{% endif %}
    {% if hx_post %}hx-post="{{ hx_post }}"{% endif %}
    {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
>
    {{ text }}
</button>
{% endif %}
